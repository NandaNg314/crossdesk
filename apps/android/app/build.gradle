plugins { id 'com.android.application' }

android {
    namespace = 'cn.crossdesk.mobile'
    compileSdk = 36
    ndkVersion = '28.2.13676358'
    defaultConfig {
        applicationId = 'cn.crossdesk.mobile'
        minSdk = 26
        targetSdk = 36
        versionCode = providers.gradleProperty('crossdeskVersionCode').get().toInteger()
        versionName = providers.gradleProperty('crossdeskVersionName').get()
        ndk { abiFilters 'arm64-v8a' }
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    sourceSets.main.jniLibs.srcDirs = [layout.buildDirectory.dir('native')]
    sourceSets.main.assets.srcDirs += [layout.buildDirectory.dir('generated/notices')]
    sourceSets.androidTest.java.srcDirs = ['../test/android/java']
    sourceSets.androidTest.assets.srcDirs = ['../test/android/assets']
    buildTypes.release { minifyEnabled = false }
    packaging.jniLibs.useLegacyPackaging = false
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}

def pythonExecutable = providers.gradleProperty('pythonExecutable').orElse('python3')
def skipNativeBuild = providers.gradleProperty('skipNativeBuild').map { it.toBoolean() }.orElse(false)
def prebuiltArm64Lib = layout.buildDirectory.file('native/arm64-v8a/libcrossdesk_android.so')

tasks.register('buildMiniRtc', Exec) {
    workingDir rootProject.projectDir
    commandLine pythonExecutable.get(), 'scripts/build_native.py'
    environment 'PYTHONUTF8', '1'
    environment 'ANDROID_HOME', androidComponents.sdkComponents.sdkDirectory.get().asFile.absolutePath
    onlyIf { !(skipNativeBuild.get() && prebuiltArm64Lib.get().asFile.isFile()) }
}
tasks.named('preBuild').configure { dependsOn 'buildMiniRtc' }
tasks.register('generateNotices', Exec) {
    workingDir rootProject.projectDir
    commandLine pythonExecutable.get(), 'scripts/generate_notices.py'
    environment 'PYTHONUTF8', '1'
}
tasks.named('preBuild').configure { dependsOn 'generateNotices' }
